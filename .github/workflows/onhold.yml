# Run once at setup (setup/02-bootstrap-app-repo.sh starts it): builds the
# "Demo on hold" page of the baseline commit as the :onhold image used by RAZ.
name: Build on-hold image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the baseline
        uses: actions/checkout@v4
        with:
          ref: baseline

      - name: Build and push :onhold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:onhold"
          echo "onhold" > app/version.txt
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$IMAGE" app
          docker push "$IMAGE"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
