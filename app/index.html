<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo on hold</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(circle at 30% 20%, #2b2160, #0f1420 60%); color: #e8ecf4; }
  .box { text-align: center; padding: 48px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #7b5cff; margin: 0 auto 28px;
         animation: pulse 2s infinite; }
  h1 { font-size: 56px; margin: 0 0 12px; letter-spacing: -1px; }
  p { color: #8b97b0; font-size: 20px; margin: 0; }
  small { display: block; margin-top: 40px; color: #56607a; font-size: 13px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(123,92,255,.6); } 50% { box-shadow: 0 0 0 22px rgba(123,92,255,0); } }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>Demo on hold</h1>
    <p>Waiting for the next vibecoded app&hellip;</p>
    <small>Served by Nutanix Kubernetes Platform</small>
  </div>
</body>
</html>
